name: sync-cn-split-v2

on:
  workflow_dispatch:            # 保留手动 Run workflow 按钮
  schedule:
    - cron: '0 17 * * *'        # UTC 19:00 = 北京时间每天 3:00

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行同步脚本 v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # 自定义追加（在 Settings → Secrets and variables → Actions → Variables 里配，可留空）
          EXTRA_CIDRS: ${{ vars.EXTRA_CIDRS }}
          EXTRA_FALLBACK: ${{ vars.EXTRA_FALLBACK }}
          # 首次运行建议先改成 true，确认统计数字无误后再改回 false
          DRY_RUN: false
        run: python cf_zt_cn_split_v2.py
